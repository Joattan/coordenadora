{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Coordenadora | ODORATA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f58220 0%, #ff9a44 100%);
        }

        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            width: 150px;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #333;
        }

        p {
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: #555;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            border: 1.5px solid #ddd;
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .form-control:focus {
            border-color: #f58220;
            outline: none;
            box-shadow: 0 0 0 4px rgba(245, 130, 32, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #f58220 0%, #ff9a44 100%);
            color: white;
            border: none;
            padding: 1rem;
            width: 100%;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(245, 130, 32, 0.3);
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(245, 130, 32, 0.4);
        }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.8rem;
        }

        .footer-link {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #999;
        }

        .footer-link a {
            color: #f58220;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <img src="{% static 'core/images/logo_odorata_main.png' %}" alt="Odorata" class="logo" style="width: auto; height: 60px;">
        <h1>Área da Coordenadora</h1>
        <p>Acesse seu painel com CPF e senha.</p>

        {% if form.errors %}
        <div class="error-msg">
            Usuário ou senha incorretos. Verifique seus dados.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>CPF (Login)</label>
                <input type="text" name="username" class="form-control" placeholder="Apenas números" required id="id_username">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Sua senha" required id="id_password">
            </div>
            <button type="submit" class="btn-login">Entrar no Painel</button>
        </form>

        <div class="footer-link">
            Não é uma coordenadora? <a href="{% url 'coordenadoras:cadastro' %}">Faça sua proposta</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        $(document).ready(function() {
            // Se preferir que o login aceite máscara:
            // $('#id_username').mask('000.000.000-00');
        });
    </script>
</body>

</html>
