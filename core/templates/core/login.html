{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Coordenadora | ODORATA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: url('{% static "core/images/coordenadora_hero.png" %}') center/cover no-repeat;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(245, 130, 32, 0.4) 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 1;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            padding: 3.5rem;
            border-radius: 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .logo {
            height: 70px;
            margin-bottom: 2.5rem;
            filter: brightness(0) invert(1);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            margin-bottom: 2.5rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.8rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.9);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            width: 100%;
            padding: 1.1rem 1.4rem;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            font-family: inherit;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: #f58220;
            outline: none;
            box-shadow: 0 0 0 4px rgba(245, 130, 32, 0.2);
        }

        .btn-login {
            background: linear-gradient(135deg, #f58220 0%, #ff9a44 100%);
            color: white;
            border: none;
            padding: 1.2rem;
            width: 100%;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(245, 130, 32, 0.4);
            transition: all 0.3s ease;
            margin-top: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(245, 130, 32, 0.5);
            filter: brightness(1.1);
        }

        .error-msg {
            background: rgba(230, 51, 77, 0.2);
            color: #ffcad1;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            border: 1px solid rgba(230, 51, 77, 0.3);
            backdrop-filter: blur(10px);
        }

        .footer-link {
            margin-top: 2.5rem;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .footer-link a {
            color: #f58220;
            text-decoration: none;
            font-weight: 700;
            margin-left: 5px;
            transition: color 0.3s;
        }

        .footer-link a:hover {
            color: #ff9a44;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <img src="{% static 'core/images/logo_odorata_main.png' %}" alt="Odorata" class="logo" style="width: auto; height: 60px;">
        <h1>Área da Coordenadora</h1>
        <p>Acesse seu painel com CPF e senha.</p>

        {% if form.errors %}
        <div class="error-msg">
            Usuário ou senha incorretos. Verifique seus dados.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>CPF (Login)</label>
                <input type="text" name="username" class="form-control" placeholder="Apenas números" required id="id_username">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" class="form-control" placeholder="Sua senha" required id="id_password">
            </div>
            <button type="submit" class="btn-login">Entrar no Painel</button>
        </form>

        <div class="footer-link">
            Não é uma coordenadora? <a href="{% url 'coordenadoras:cadastro' %}">Faça sua proposta</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
    <script>
        $(document).ready(function() {
            // Se preferir que o login aceite máscara:
            // $('#id_username').mask('000.000.000-00');
        });
    </script>
</body>

</html>
